version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: errsight-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: errsight
      POSTGRES_PASSWORD: errsight
      POSTGRES_DB: errsight
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U errsight"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: errsight-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: errsight-api
    restart: unless-stopped
    command: ["node", "dist/index.js"]
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://errsight:errsight@postgres:5432/errsight
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change-me-super-secret
      DASHBOARD_ORIGIN: http://localhost:5173
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: errsight-worker
    restart: unless-stopped
    command: ["node", "dist/workers/processEvent.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://errsight:errsight@postgres:5432/errsight
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
